name: .NET CI/CD Azure Function - optimized

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    env:
      # 👇 Hace que DefaultAzureCredential funcione en integration tests
      AZURE_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}
      AZURE_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
      AZURE_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}

    steps:
    # 1️⃣ Checkout
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Setup .NET + cache
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        cache: true

    # 3️⃣ Restore
    - name: Restore dependencies
      run: dotnet restore

    # 4️⃣ Build
    - name: Build solution
      run: dotnet build -c Release --no-restore

    # 5️⃣ Unit Tests
    - name: Run Unit Tests
      run: |
        dotnet test **/*Tests.csproj \
          --filter "Category!=Integration" \
          -c Release \
          --no-build \
          --collect:"XPlat Code Coverage"

    # 6️⃣ Integration Tests (ya con credenciales)
    - name: Run Integration Tests
      run: |
        dotnet test **/*IntegrationTests.csproj \
          -c Release \
          --no-build \
          --verbosity normal

    # 7️⃣ Azure Login (solo para deploy)
    - name: Azure Login
      if: ${{ success() }}
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # 8️⃣ Publish
    - name: Publish Azure Function
      if: ${{ success() }}
      run: |
        FUNCTION_PROJECT=$(find . -name "SunatIntegration.Functions.csproj" | head -n 1)
        dotnet publish "$FUNCTION_PROJECT" -c Release -o ./publish --no-build

    # 9️⃣ Deploy
    - name: Deploy to Azure Functions
      if: ${{ success() }}
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
        package: ./publish
